<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Scientific Calculator</h1>

<input id="display" class="screen" type="text"
value="{{ input_value if input_value else '' }}"
placeholder="0" readonly>

<form method="POST" id="calcForm">

<input type="hidden" id="num1" name="num1">
<input type="hidden" id="num2" name="num2">
<input type="hidden" id="operation" name="operation">

<div class="row">
<button type="button" onclick="press('7')">7</button>
<button type="button" onclick="press('8')">8</button>
<button type="button" onclick="press('9')">9</button>
<button type="button" onclick="setOp('/')">÷</button>
</div>

<div class="row">
<button type="button" onclick="press('4')">4</button>
<button type="button" onclick="press('5')">5</button>
<button type="button" onclick="press('6')">6</button>
<button type="button" onclick="setOp('*')">×</button>
</div>

<div class="row">
<button type="button" onclick="press('1')">1</button>
<button type="button" onclick="press('2')">2</button>
<button type="button" onclick="press('3')">3</button>
<button type="button" onclick="setOp('-')">−</button>
</div>

<div class="row">
<button type="button" onclick="press('0')">0</button>
<button type="button" onclick="press('.')">.</button>
<button type="button" onclick="setOp('+')">+</button>
<button type="submit" class="equal">=</button>
</div>

<div class="row">
<button type="button" onclick="setSingle('sin')">sin</button>
<button type="button" onclick="setSingle('cos')">cos</button>
<button type="button" onclick="setSingle('tan')">tan</button>
<button type="button" onclick="setSingle('sqrt')">√</button>
</div>

<div class="row">
<button type="button" onclick="setSingle('log')">log</button>
<button type="button" onclick="setSingle('exp')">exp</button>
<button type="button" onclick="setOp('^')">xʸ</button>
<button type="button" onclick="clearDisplay()">C</button>
</div>

</form>

<div class="history">
<h3>History</h3>

<button type="button" onclick="clearHistory()" style="
margin-top:8px;
padding:6px 10px;
background:#ff4d6d;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
font-size:12px;">
Clear History
</button>

<ul id="historyList">
{% for item in history %}
<li>{{ item }}</li>
{% endfor %}
</ul>
</div>

</div>

<script>

let display = document.getElementById("display");
let num1Field = document.getElementById("num1");
let num2Field = document.getElementById("num2");
let opField = document.getElementById("operation");

let firstNumber="";
let secondNumber="";
let currentOperation="";
let isSecond=false;

function press(num){
if(!isSecond){
firstNumber+=num;
display.value=firstNumber;
}
else{
secondNumber+=num;
display.value=firstNumber+" "+currentOperation+" "+secondNumber;
}
}

function setOp(op){
currentOperation=op;
isSecond=true;
display.value=firstNumber+" "+op;
opField.value=op;
}

function setSingle(op){

firstNumber=display.value;

if(firstNumber==="") return;

display.value=op+"("+firstNumber+")";

num1Field.value=firstNumber;

opField.value=op;

document.getElementById("calcForm").submit();
}

function clearDisplay(){

firstNumber="";
secondNumber="";
currentOperation="";
isSecond=false;

display.value="";

num1Field.value="";
num2Field.value="";
opField.value="";
}

document.getElementById("calcForm").addEventListener("submit",function(){

num1Field.value=firstNumber;

num2Field.value=secondNumber;

});

document.addEventListener("keydown",function(e){

let key=e.key;

if(!isNaN(key)){ press(key); }

if(key==="."){ press("."); }

if(["+","-","*","/","^"].includes(key)){ setOp(key); }

if(key==="s"){ setSingle("sin"); }

if(key==="c"){ setSingle("cos"); }

if(key==="t"){ setSingle("tan"); }

if(key==="q"){ setSingle("sqrt"); }

if(key==="l"){ setSingle("log"); }

if(key==="e"){ setSingle("exp"); }

if(key==="Enter"){
e.preventDefault();
document.getElementById("calcForm").requestSubmit();
}

if(key==="Escape"){ clearDisplay(); }

if(key==="Backspace"){

if(!isSecond){
firstNumber=firstNumber.slice(0,-1);
display.value=firstNumber;
}
else{
secondNumber=secondNumber.slice(0,-1);
display.value=firstNumber+" "+currentOperation+" "+secondNumber;
}

}

});
function clearHistory(){

    let historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    fetch("/clear-history", {
        method: "POST"
    });

}

</script>

</body>
</html>

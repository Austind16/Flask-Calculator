<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="app-header">
        <h1>CalcU</h1>
    </div>

    <input id="display" class="screen" type="text"
           value="{{ input_value if input_value else '' }}"
           placeholder="0" readonly>

    <form method="POST" id="calcForm">

        <input type="hidden" id="expression" name="expression">
        <input type="hidden" id="operation" name="operation">
        <input type="hidden" id="operation_type" name="operation_type">
        <input type="hidden" id="num1" name="num1">

        <div class="row">
            <button type="button" onclick="press('7')">7</button>
            <button type="button" onclick="press('8')">8</button>
            <button type="button" onclick="press('9')">9</button>
            <button type="button" class="btn-op" onclick="setOp('/')">÷</button>
        </div>

        <div class="row">
            <button type="button" onclick="press('4')">4</button>
            <button type="button" onclick="press('5')">5</button>
            <button type="button" onclick="press('6')">6</button>
            <button type="button" class="btn-op" onclick="setOp('*')">×</button>
        </div>

        <div class="row">
            <button type="button" onclick="press('1')">1</button>
            <button type="button" onclick="press('2')">2</button>
            <button type="button" onclick="press('3')">3</button>
            <button type="button" class="btn-op" onclick="setOp('-')">−</button>
        </div>

        <div class="row">
            <button type="button" onclick="press('0')">0</button>
            <button type="button" onclick="press('.')">.</button>
            <button type="button" class="btn-op" onclick="setOp('+')">+</button>
            <button type="submit" class="equal">=</button>
        </div>

        <div class="row">
            <button type="button" class="btn-fn" onclick="setSingle('sin')">sin</button>
            <button type="button" class="btn-fn" onclick="setSingle('cos')">cos</button>
            <button type="button" class="btn-fn" onclick="setSingle('tan')">tan</button>
            <button type="button" class="btn-fn" onclick="setSingle('sqrt')">√</button>
        </div>

        <div class="row">
            <button type="button" class="btn-fn" onclick="setSingle('log')">log</button>
            <button type="button" class="btn-fn" onclick="setSingle('exp')">exp</button>
            <button type="button" class="btn-fn" onclick="setOp('^')">xʸ</button>
            <button type="button" class="btn-clear" onclick="clearDisplay()">C</button>
        </div>

        <div class="row">
            <button type="button" class="btn-fn" onclick="setBracket('(')">(</button>
            <button type="button" class="btn-fn" onclick="setBracket(')')">)</button>
            <button type="button" class="btn-fn" onclick="setSingle('square')">x²</button>
            <button type="button" class="btn-fn" onclick="insertPi()">π</button>
        </div>

    </form>

    <div class="history">
        <div class="history-header">
            <div class="history-title">
                <h3>History</h3>
                {% if history %}<span class="history-count">{{ history|length }}</span>{% endif %}
            </div>
            <button type="button" class="btn-clear-history" onclick="clearHistory()">Clear all</button>
        </div>

        <ul id="historyList" class="history-list">
            {% for item in history|reverse %}
            <li>
                <span class="history-index">{{ loop.index }}</span>
                <span class="history-entry">{{ item }}</span>
            </li>
            {% endfor %}
        </ul>
        {% if not history %}
        <p class="history-empty">Your calculations will appear here.</p>
        {% endif %}
    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
